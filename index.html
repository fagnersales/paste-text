<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Paste &amp; Caption</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0e0e10; color: #eee; font-family: ui-sans-serif, system-ui, sans-serif; }
  .app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
  header {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 12px; background: #17171a; border-bottom: 1px solid #2a2a2f;
  }
  header input[type="text"], header input[type="number"], header select, header input[type="color"] {
    background: #0e0e10; color: #eee; border: 1px solid #2a2a2f; border-radius: 6px;
    padding: 6px 8px; font: inherit;
  }
  header input[type="text"] { min-width: 240px; flex: 1 1 240px; }
  header label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #bdbdc4; }
  header button {
    background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 7px 12px;
    cursor: pointer; font: inherit;
  }
  header button.ghost { background: #2a2a2f; }
  header button:disabled { opacity: .5; cursor: not-allowed; }
  .split { position: relative; display: inline-flex; }
  .split > button:first-child { border-radius: 6px 0 0 6px; }
  .split > button.caret {
    background: #1d4fd8; color: #fff; border: 0; border-left: 1px solid rgba(255,255,255,.25);
    border-radius: 0 6px 6px 0; padding: 7px 8px; cursor: pointer;
  }
  .split > button.caret.ghost { background: #232328; border-left-color: rgba(255,255,255,.08); }
  .menu {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 10;
    background: #1d1d22; border: 1px solid #2a2a2f; border-radius: 8px;
    min-width: 200px; padding: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .menu[hidden] { display: none; }
  .menu button {
    display: flex; justify-content: space-between; gap: 12px;
    width: 100%; text-align: left; background: transparent; color: #eee;
    border: 0; padding: 7px 10px; border-radius: 4px; cursor: pointer; font: inherit;
  }
  .menu button:hover { background: #2a2a2f; }
  .menu .sub { color: #8b8b94; font-size: 12px; }
  .stage {
    position: relative; overflow: auto; padding: 24px;
    background:
      linear-gradient(45deg, #15151a 25%, transparent 25%) 0 0/20px 20px,
      linear-gradient(-45deg, #15151a 25%, transparent 25%) 0 10px/20px 20px,
      #1b1b20;
  }
  .canvas-wrap {
    position: relative; display: inline-block; margin: 0 auto;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  canvas { display: block; max-width: 100%; height: auto; background: #000; }
  .hint {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #9b9ba3; pointer-events: none; font-size: 14px;
  }
  .hint kbd {
    background: #2a2a2f; border: 1px solid #3a3a42; border-bottom-width: 2px;
    padding: 1px 6px; border-radius: 4px; font-family: ui-monospace, monospace;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <input id="text" type="text" placeholder="Type caption here…" />
    <label>Size <input id="size" type="number" min="8" max="400" value="48" style="width:72px" /></label>
    <label>Color <input id="color" type="color" value="#ffffff" /></label>
    <label>Stroke <input id="stroke" type="color" value="#000000" /></label>
    <label>Stroke px <input id="strokeW" type="number" min="0" max="40" value="3" style="width:64px" /></label>
    <label>Font
      <select id="font">
        <option>Impact</option>
        <option>Arial Black</option>
        <option>Helvetica</option>
        <option>Georgia</option>
        <option>Comic Sans MS</option>
        <option>Courier New</option>
      </select>
    </label>
    <div class="split">
      <button id="copy" disabled>Copy Image</button>
      <button id="copyCaret" class="caret" disabled aria-label="Copy variants">▾</button>
      <div class="menu" id="copyMenu" hidden></div>
    </div>
    <div class="split">
      <button id="download" disabled>Download PNG</button>
      <button id="downloadCaret" class="caret" disabled aria-label="Download variants">▾</button>
      <div class="menu" id="downloadMenu" hidden></div>
    </div>
    <button id="reset" class="ghost" disabled>Reset</button>
  </header>
  <div class="stage" id="stage">
    <div class="canvas-wrap" id="wrap">
      <canvas id="cv" width="900" height="500"></canvas>
      <div class="hint" id="hint">Press <kbd>Ctrl</kbd>+<kbd>V</kbd> to paste an image</div>
    </div>
  </div>
</div>
<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const hint = document.getElementById('hint');
  const wrap = document.getElementById('wrap');
  const $text = document.getElementById('text');
  const $size = document.getElementById('size');
  const $color = document.getElementById('color');
  const $stroke = document.getElementById('stroke');
  const $strokeW = document.getElementById('strokeW');
  const $font = document.getElementById('font');
  const $dl = document.getElementById('download');
  const $dlCaret = document.getElementById('downloadCaret');
  const $dlMenu = document.getElementById('downloadMenu');
  const $copy = document.getElementById('copy');
  const $copyCaret = document.getElementById('copyCaret');
  const $copyMenu = document.getElementById('copyMenu');
  const $reset = document.getElementById('reset');

  let img = null;
  // text position in image-pixel coords (center of text)
  let pos = { x: 0.5, y: 0.9 }; // normalized 0..1 until image set; replaced with px after
  let posPx = null;
  let dragging = false;
  let dragOff = { x: 0, y: 0 };

  function setImage(image) {
    img = image;
    cv.width = image.naturalWidth;
    cv.height = image.naturalHeight;
    // place text centered near bottom by default
    posPx = { x: cv.width / 2, y: cv.height * 0.9 };
    hint.style.display = 'none';
    $dl.disabled = false;
    $dlCaret.disabled = false;
    $copy.disabled = false;
    $copyCaret.disabled = false;
    $reset.disabled = false;
    fitCanvasDisplay();
    draw();
  }

  function fitCanvasDisplay() {
    // limit displayed width to viewport
    const maxW = wrap.parentElement.clientWidth - 48;
    const maxH = wrap.parentElement.clientHeight - 48;
    const ratio = cv.width / cv.height;
    let w = cv.width, h = cv.height;
    if (w > maxW) { w = maxW; h = w / ratio; }
    if (h > maxH) { h = maxH; w = h * ratio; }
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
  }

  function draw() {
    if (!img) {
      ctx.clearRect(0, 0, cv.width, cv.height);
      return;
    }
    ctx.drawImage(img, 0, 0);
    const text = $text.value;
    if (!text) return;
    const size = +$size.value || 48;
    const font = $font.value;
    ctx.font = `bold ${size}px "${font}", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;
    const sw = +$strokeW.value || 0;
    if (sw > 0) {
      ctx.lineWidth = sw * 2;
      ctx.strokeStyle = $stroke.value;
      ctx.strokeText(text, posPx.x, posPx.y);
    }
    ctx.fillStyle = $color.value;
    ctx.fillText(text, posPx.x, posPx.y);
  }

  // paste handler
  window.addEventListener('paste', async (e) => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const it of items) {
      if (it.type.startsWith('image/')) {
        const file = it.getAsFile();
        if (!file) continue;
        const url = URL.createObjectURL(file);
        const im = new Image();
        im.onload = () => { setImage(im); URL.revokeObjectURL(url); };
        im.src = url;
        e.preventDefault();
        return;
      }
    }
  });

  // also accept drag-drop
  window.addEventListener('dragover', (e) => { e.preventDefault(); });
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    const file = e.dataTransfer?.files?.[0];
    if (!file || !file.type.startsWith('image/')) return;
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { setImage(im); URL.revokeObjectURL(url); };
    im.src = url;
  });

  // mapping screen -> canvas pixels
  function toCanvasCoords(clientX, clientY) {
    const r = cv.getBoundingClientRect();
    const x = (clientX - r.left) * (cv.width / r.width);
    const y = (clientY - r.top) * (cv.height / r.height);
    return { x, y };
  }

  cv.addEventListener('pointerdown', (e) => {
    if (!img) return;
    cv.setPointerCapture(e.pointerId);
    const p = toCanvasCoords(e.clientX, e.clientY);
    dragOff.x = posPx.x - p.x;
    dragOff.y = posPx.y - p.y;
    dragging = true;
  });
  cv.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const p = toCanvasCoords(e.clientX, e.clientY);
    posPx.x = p.x + dragOff.x;
    posPx.y = p.y + dragOff.y;
    draw();
  });
  const endDrag = (e) => { dragging = false; try { cv.releasePointerCapture(e.pointerId); } catch {} };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  cv.style.cursor = 'move';

  // controls
  for (const el of [$text, $size, $color, $stroke, $strokeW, $font]) {
    el.addEventListener('input', draw);
    el.addEventListener('change', draw);
  }

  // Variants: { label, mode: 'original'|'fit'|'square', size? }
  const VARIANTS = [
    { label: 'Original',          mode: 'original' },
    { label: 'Fit 1024px',        mode: 'fit', size: 1024, sub: 'longest edge' },
    { label: 'Fit 512px',         mode: 'fit', size: 512,  sub: 'longest edge' },
    { label: 'Fit 256px',         mode: 'fit', size: 256,  sub: 'longest edge' },
    { label: 'Sticker 512²',      mode: 'square', size: 512, sub: 'WhatsApp / Telegram' },
    { label: 'Sticker 320²',      mode: 'square', size: 320, sub: 'Discord' },
    { label: 'Emoji 128²',        mode: 'square', size: 128, sub: 'Slack' },
  ];

  function renderToCanvas(opts) {
    const off = document.createElement('canvas');
    const sw = cv.width, sh = cv.height;
    let dw, dh, ix, iy, iw, ih;
    if (opts.mode === 'original') {
      dw = sw; dh = sh; ix = 0; iy = 0; iw = sw; ih = sh;
    } else if (opts.mode === 'fit') {
      const N = opts.size;
      if (sw >= sh) { dw = N; dh = Math.max(1, Math.round(N * sh / sw)); }
      else          { dh = N; dw = Math.max(1, Math.round(N * sw / sh)); }
      ix = 0; iy = 0; iw = dw; ih = dh;
    } else if (opts.mode === 'square') {
      const N = opts.size;
      dw = N; dh = N;
      if (sw >= sh) { iw = N; ih = Math.round(N * sh / sw); ix = 0; iy = Math.round((N - ih) / 2); }
      else          { ih = N; iw = Math.round(N * sw / sh); iy = 0; ix = Math.round((N - iw) / 2); }
    }
    off.width = dw; off.height = dh;
    const oc = off.getContext('2d');
    oc.imageSmoothingEnabled = true;
    oc.imageSmoothingQuality = 'high';
    oc.drawImage(img, ix, iy, iw, ih);
    const text = $text.value;
    if (text) {
      const scale = iw / sw;
      const tx = ix + (posPx.x / sw) * iw;
      const ty = iy + (posPx.y / sh) * ih;
      const size = (+$size.value || 48) * scale;
      const stroke = (+$strokeW.value || 0) * scale;
      oc.font = `bold ${size}px "${$font.value}", sans-serif`;
      oc.textAlign = 'center';
      oc.textBaseline = 'middle';
      oc.lineJoin = 'round';
      oc.miterLimit = 2;
      if (stroke > 0) {
        oc.lineWidth = stroke * 2;
        oc.strokeStyle = $stroke.value;
        oc.strokeText(text, tx, ty);
      }
      oc.fillStyle = $color.value;
      oc.fillText(text, tx, ty);
    }
    return off;
  }

  function renderToBlob(opts) {
    return new Promise((res) => renderToCanvas(opts).toBlob(res, 'image/png'));
  }

  function variantLabel(v) {
    return v.mode === 'original' ? 'caption' : `caption-${v.mode === 'square' ? v.size + 'sq' : v.size}`;
  }

  async function doDownload(v) {
    const canvas = renderToCanvas(v);
    canvas.toBlob((blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${variantLabel(v)}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  }

  async function doCopy(v, btn) {
    const orig = btn.textContent;
    try {
      const blob = await renderToBlob(v);
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      btn.textContent = 'Copied!';
    } catch (err) {
      console.error(err);
      btn.textContent = 'Copy failed';
    }
    setTimeout(() => { btn.textContent = orig; }, 1200);
  }

  function buildMenu(menuEl, onPick) {
    menuEl.innerHTML = '';
    for (const v of VARIANTS) {
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = `<span>${v.label}</span>${v.sub ? `<span class="sub">${v.sub}</span>` : ''}`;
      b.addEventListener('click', () => { menuEl.hidden = true; onPick(v); });
      menuEl.appendChild(b);
    }
  }
  buildMenu($dlMenu, (v) => doDownload(v));
  buildMenu($copyMenu, (v) => doCopy(v, $copy));

  function toggleMenu(menu, others) {
    others.forEach((m) => { m.hidden = true; });
    menu.hidden = !menu.hidden;
  }
  $dlCaret.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu($dlMenu, [$copyMenu]); });
  $copyCaret.addEventListener('click', (e) => { e.stopPropagation(); toggleMenu($copyMenu, [$dlMenu]); });
  document.addEventListener('click', () => { $dlMenu.hidden = true; $copyMenu.hidden = true; });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { $dlMenu.hidden = true; $copyMenu.hidden = true; }
  });

  // main button = default action (Original)
  $dl.addEventListener('click', () => { if (img) doDownload(VARIANTS[0]); });
  $copy.addEventListener('click', () => { if (img) doCopy(VARIANTS[0], $copy); });

  $reset.addEventListener('click', () => {
    if (!img) return;
    posPx = { x: cv.width / 2, y: cv.height * 0.9 };
    draw();
  });

  window.addEventListener('resize', () => { if (img) fitCanvasDisplay(); });
})();
</script>
</body>
</html>
